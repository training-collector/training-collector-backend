# Конфигурация API и базы данных. Каждое значение по умолчанию можно переопределить
# переменной окружения из следующей строки. Длительности: 90s, 5m, 1h, 30d.
app {
  db {
    port = 5433
    port = ${?DB_PORT}
    name = "training"
    name = ${?DB_NAME}
    jdbcUrl = "jdbc:postgresql://localhost:"${app.db.port}"/"${app.db.name}
    jdbcUrl = ${?DB_JDBC_URL}
    user = "training_app"
    user = ${?DB_USER}
    password = ${DB_PASSWORD}
    maxPoolSize = 5
    maxPoolSize = ${?DB_MAX_POOL_SIZE}
    # false: не открывать соединение при старте. Миграции тогда выполняет отдельный шаг:
    # bin/training-collector-backend migrate
    migrateOnStart = true
    migrateOnStart = ${?DB_MIGRATE_ON_START}
  }

  server {
    host = "0.0.0.0"
    host = ${?SERVER_HOST}
    port = 8080
    port = ${?SERVER_PORT}
    port = ${?PORT}
    # Заголовок с адресом клиента от своего прокси, например X-Real-IP. Пусто: адрес соединения.
    clientIpHeader = ""
    clientIpHeader = ${?CLIENT_IP_HEADER}
  }

  security {
    # Секрет для подписи токенов. Пусто: выводится из остальных секретов сервиса.
    secret = ""
    secret = ${?APP_SECRET}
  }

  bots {
    authKey = ""
    authKey = ${?AUTH_SERVICE_KEY}
    trainingKey = ""
    trainingKey = ${?TRAINING_SERVICE_KEY}
  }

  admin {
    login = ""
    login = ${?ADMIN_LOGIN}
    password = ""
    password = ${?ADMIN_PASSWORD}
    sessionTtl = 8h
    sessionTtl = ${?ADMIN_SESSION_TTL}
  }

  limits {
    # Отключить лимиты можно только этим флагом.
    enabled = true
    enabled = ${?LIMITS_ENABLED}
    register { requests = 5, window = 1h }
    register.requests = ${?LIMIT_REGISTER_REQUESTS}
    register.window = ${?LIMIT_REGISTER_WINDOW}
    loginRequest { requests = 10, window = 10m }
    loginRequest.requests = ${?LIMIT_LOGIN_REQUEST_REQUESTS}
    loginRequest.window = ${?LIMIT_LOGIN_REQUEST_WINDOW}
    # Сайт спрашивает статус запроса входа каждые 2 секунды. Счётчик в памяти: опрос не будит базу.
    loginStatus { requests = 120, window = 1m }
    loginStatus.requests = ${?LIMIT_LOGIN_STATUS_REQUESTS}
    loginStatus.window = ${?LIMIT_LOGIN_STATUS_WINDOW}
    adminLogin { requests = 5, window = 15m }
    adminLogin.requests = ${?LIMIT_ADMIN_LOGIN_REQUESTS}
    adminLogin.window = ${?LIMIT_ADMIN_LOGIN_WINDOW}
    clientErrors { requests = 10, window = 1h }
    clientErrors.requests = ${?LIMIT_CLIENT_ERRORS_REQUESTS}
    clientErrors.window = ${?LIMIT_CLIENT_ERRORS_WINDOW}
    api { requests = 300, window = 1m }
    api.requests = ${?LIMIT_API_REQUESTS}
    api.window = ${?LIMIT_API_WINDOW}
    maxBodyBytes = 1048576
    maxBodyBytes = ${?LIMIT_MAX_BODY_BYTES}
  }

  login {
    # Сколько действует запрос входа, который тренер подтверждает кнопкой в Telegram.
    requestTtl = 5m
    requestTtl = ${?LOGIN_REQUEST_TTL}
    # Пауза перед повторной попыткой отправить запрос, если бот не подтвердил отправку.
    deliveryRetry = 1m
    deliveryRetry = ${?LOGIN_DELIVERY_RETRY}
    # Сколько запросов одного тренера ждут ответа одновременно. Более старые отменяются. Запас большой,
    # чтобы посторонний не мог чужими запросами вытеснить запрос самого тренера.
    maxPending = 20
    maxPending = ${?LOGIN_MAX_PENDING}
    sessionTtl = 30d
    sessionTtl = ${?LOGIN_SESSION_TTL}
  }

  signup {
    ttl = 1d
    ttl = ${?SIGNUP_TTL}
    cleanupInterval = 1h
    cleanupInterval = ${?SIGNUP_CLEANUP_INTERVAL}
  }

  links {
    signupTtl = 5m
    signupTtl = ${?LINK_SIGNUP_TTL}
    trainingTtl = 10m
    trainingTtl = ${?LINK_TRAINING_TTL}
  }

  apiKey {
    ttl = 90d
    ttl = ${?API_KEY_TTL}
  }

  notifications {
    ttl = 24h
    ttl = ${?NOTIFICATION_TTL}
    retryPause = 1m
    retryPause = ${?NOTIFICATION_RETRY_PAUSE}
  }

  telegram {
    updateLease = 90s
    updateLease = ${?TELEGRAM_UPDATE_LEASE}
    dialogTtl = 30d
    dialogTtl = ${?TELEGRAM_DIALOG_TTL}
    receiptTtl = 2d
    receiptTtl = ${?TELEGRAM_RECEIPT_TTL}
  }

  audit {
    retention = 90d
    retention = ${?AUDIT_RETENTION}
  }
}
