# Конфигурация API и базы данных.
app {
  db {
    port = 5433
    port = ${?DB_PORT}
    name = "training"
    name = ${?DB_NAME}
    jdbcUrl = "jdbc:postgresql://localhost:"${app.db.port}"/"${app.db.name}
    jdbcUrl = ${?DB_JDBC_URL}
    user = "training_app"
    user = ${?DB_USER}
    password = ${DB_PASSWORD}
    maxPoolSize = 5
    maxPoolSize = ${?DB_MAX_POOL_SIZE}
  }

  server {
    host = "0.0.0.0"
    host = ${?SERVER_HOST}
    port = 8080
    port = ${?SERVER_PORT}
    port = ${?PORT}
  }
}

app.bots {
  authKey = ""
  authKey = ${?AUTH_SERVICE_KEY}
  trainingKey = ""
  trainingKey = ${?TRAINING_SERVICE_KEY}
}

app.admin {
  login = ""
  login = ${?ADMIN_LOGIN}
  password = ""
  password = ${?ADMIN_PASSWORD}
}
